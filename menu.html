<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Royal Feast Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="navbar"></div>

  <header class="page-header">
    <div class="container">
      <h1>Our Menu</h1>
      <p>Fresh, flavourful and made to order. All prices in PKR.</p>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <!-- Search, filters and sorting -->
      <div class="filter-bar mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-lg-5">
            <div class="input-group">
              <span class="input-group-text bg-transparent text-gold border-secondary"><i class="bi bi-search"></i></span>
              <input type="search" id="searchInput" class="form-control" placeholder="Search dishes, e.g. burger, biryani...">
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <select id="sortSelect" class="form-select">
              <option value="default">Sort: Default</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </div>
          <div class="col-sm-6 col-lg-4 d-flex gap-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="vegOnly">
              <label class="form-check-label" for="vegOnly">Vegetarian</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="spicyOnly">
              <label class="form-check-label" for="spicyOnly">Spicy</label>
            </div>
          </div>
        </div>
        <div class="category-pills mt-3" id="categoryFilters"></div>
      </div>

      <p class="text-cream-dim" id="resultCount"></p>
      <div class="row g-4" id="menuGrid"></div>

      <div id="noResults" class="empty-note d-none">
        <i class="bi bi-emoji-frown fs-1 text-gold"></i>
        <h5 class="mt-2">No dishes found</h5>
        <p>Try a different search or clear the filters.</p>
        <button class="btn btn-outline-gold" id="clearFilters">Clear Filters</button>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
