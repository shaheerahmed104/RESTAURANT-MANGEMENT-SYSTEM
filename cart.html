<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Royal Feast Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="navbar"></div>

  <header class="page-header">
    <div class="container">
      <h1>Your Cart</h1>
      <p>Review your items before checkout.</p>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <!-- Shown when the cart has no items -->
      <div id="cartEmpty" class="empty-note d-none">
        <i class="bi bi-cart-x display-1 text-gold"></i>
        <h3 class="font-display mt-3">Your cart is empty</h3>
        <p>Looks like you have not added anything yet.</p>
        <a href="menu.html" class="btn btn-gold">Browse the Menu</a>
      </div>

      <!-- Shown when the cart has items -->
      <div class="row g-4 d-none" id="cartContent">
        <div class="col-lg-8">
          <div id="cartItems"></div>
          <div class="d-flex flex-wrap gap-2 mt-3">
            <a href="menu.html" class="btn btn-outline-gold"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
            <button class="btn btn-outline-danger" id="clearCartBtn"><i class="bi bi-trash3"></i> Clear Cart</button>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="summary-card">
            <h4 class="font-display text-gold mb-3">Order Summary</h4>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">PKR 0</span></div>
            <div class="summary-row"><span>Discount</span><span id="discount" class="text-success">- PKR 0</span></div>
            <div class="summary-row"><span>Delivery charges</span><span id="delivery">PKR 0</span></div>
            <div class="summary-row summary-total"><span>Final Bill</span><span id="total">PKR 0</span></div>
            <p class="small text-cream-dim mt-3 mb-1" id="discountNote"></p>
            <p class="small text-cream-dim" id="deliveryNote"></p>
            <a href="checkout.html" class="btn btn-gold w-100 btn-lg">Proceed to Checkout</a>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
