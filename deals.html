<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deals | Royal Feast Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="navbar"></div>

  <header class="page-header">
    <div class="container">
      <h1>Deals &amp; Offers</h1>
      <p>Combo meals, family deals and everyday savings.</p>
    </div>
  </header>

  <!-- Offer highlights (filled by main.js) -->
  <section class="section pb-0">
    <div class="container">
      <div class="row g-4" id="offerInfo"></div>
    </div>
  </section>

  <!-- Deal cards (filled by main.js) -->
  <section class="section">
    <div class="container">
      <div class="section-title">
        <small>Hot Right Now</small>
        <h2>Combo &amp; Family Deals</h2>
      </div>
      <div class="row g-4" id="dealsContainer"></div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container">
      <h2 class="font-display">Planning a party?</h2>
      <p class="text-cream-dim">Book a table for your group and pair it with one of our family deals.</p>
      <a href="booking.html" class="btn btn-gold btn-lg">Book a Table</a>
    </div>
  </section>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
